<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherApi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1e293b;
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3bd3a0;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .profile-box {
      background: #0f172a;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-top: 8px;
    }

    .profile-box .name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .profile-box .nim {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 2px;
    }

    .search-wrapper {
      margin-top: 24px;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .search-box button {
      background: #10b981;
      color: #0f172a;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .search-box button:hover {
      background: #34d399;
      transform: translateY(-1px);
    }

    .search-box button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .result-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .data-card {
      background: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      border-left: 4px solid #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data-card.highlight {
      border-left-color: #10b981;
    }

    .data-card .label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .data-card .value {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      text-align: right;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .coord-box {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      text-align: center;
    }

    .coord-box .coord-label {
      font-size: 10px;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .coord-box .coord-value {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-all;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="header-section">
      <span class="app-tag">Geocoding API Explorer</span>
      <div class="profile-box">
        <div class="name">Maulina Khamidah</div>
        <div class="nim">20240140221</div>
      </div>
    </div>

    <div class="search-wrapper">
      <div class="search-box">
        <input type="text" id="inputLokasi" placeholder="Masukkan nama lokasi (contoh: Sleman, Jakarta)..." value="Sleman" onkeypress="handleKeyPress(event)">
        <button id="btnCari" onclick="cariLokasi()">Cari</button>
      </div>
    </div>

    <div id="errorBox" class="error-box" style="display: none;"></div>

    <div class="result-section" id="resultBox" style="display: none;">
      <div class="data-card highlight">
        <span class="label">Input Lokasi</span>
        <span class="value" id="resLokasi">-</span>
      </div>

      <div class="data-card">
        <span class="label">Negara</span>
        <span class="value" id="resNegara">-</span>
      </div>

      <div class="data-card">
        <span class="label">Provinsi</span>
        <span class="value" id="resProvinsi">-</span>
      </div>

      <div class="data-card">
        <span class="label">Kecamatan / Kota</span>
        <span class="value" id="resKecamatan">-</span>
      </div>

      <div class="coords-grid">
        <div class="coord-box">
          <div class="coord-label">Longitude</div>
          <div class="coord-value" id="resLongitude">-</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">Latitude</div>
          <div class="coord-value" id="resLatitude">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        cariLokasi();
      }
    }

    async function cariLokasi() {
      const lokasiInput = document.getElementById('inputLokasi');
      const btnCari = document.getElementById('btnCari');
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');

      const lokasi = lokasiInput.value.trim();
      if (!lokasi) {
        showError('Silakan masukkan nama lokasi terlebih dahulu.');
        return;
      }

      // Reset State UI
      hideError();
      btnCari.disabled = true;
      btnCari.innerText = 'Memuat...';

      try {
        const response = await fetch(`/api/lokasi?kota=${encodeURIComponent(lokasi)}`);
        const data = await response.json();

        if (!response.ok) {
          showError(data.message || 'Lokasi tidak ditemukan.');
          resultBox.style.display = 'none';
          return;
        }

        document.getElementById('resLokasi').innerText = data.input_lokasi || '-';
        document.getElementById('resNegara').innerText = data.negara || '-';
        document.getElementById('resProvinsi').innerText = data.provinsi || '-';
        document.getElementById('resKecamatan').innerText = data.kecamatan || '-';
        document.getElementById('resLongitude').innerText = data.longitude || '-';
        document.getElementById('resLatitude').innerText = data.latitude || '-';

        resultBox.style.display = 'flex';
      } catch (err) {
        console.error(err);
        showError('Gagal menghubungkan ke server. Pastikan server Node.js aktif.');
        resultBox.style.display = 'none';
      } finally {
        btnCari.disabled = false;
        btnCari.innerText = 'Cari';
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
    }

    window.onload = () => {
      cariLokasi();
    };
  </script>
</body>
</html>
